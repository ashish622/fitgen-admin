name: Build and Deploy FitGen Admin to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Prepare environment configuration
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY || 'dummy_api_key' }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID || '1:522439673471:web:1104423e54babcd4b5214a' }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID || '522439673471' }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || 'fitgen-fa9b4' }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN || 'fitgen-fa9b4.firebaseapp.com' }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET || 'fitgen-fa9b4.firebasestorage.app' }}
        run: |
          mkdir -p env
          cat <<EOF > env/dev.json
          {
            "FIREBASE_API_KEY": "$FIREBASE_API_KEY",
            "FIREBASE_APP_ID": "$FIREBASE_APP_ID",
            "FIREBASE_MESSAGING_SENDER_ID": "$FIREBASE_MESSAGING_SENDER_ID",
            "FIREBASE_PROJECT_ID": "$FIREBASE_PROJECT_ID",
            "FIREBASE_AUTH_DOMAIN": "$FIREBASE_AUTH_DOMAIN",
            "FIREBASE_STORAGE_BUCKET": "$FIREBASE_STORAGE_BUCKET"
          }
          EOF

      - name: Build Web Application for GitHub Pages
        run: |
          flutter build web --release --base-href "/fitgen-admin/" --dart-define-from-file=env/dev.json
          # Copy index.html to 404.html so GitHub Pages can route SPA deep-links
          cp build/web/index.html build/web/404.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/web'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
